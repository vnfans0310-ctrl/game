<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>스카이 스트라이커</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  canvas { display: block; background: #070a1c; box-shadow: 0 0 40px rgba(80,140,255,.25); border-radius: 6px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const W = 480, H = 720;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', fit); fit();

// ---------- Sound (WebAudio, 합성음) ----------
let ac = null, muted = false;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
function beep(freq, dur, type = 'square', vol = 0.05, slide = 0) {
  const a = audio(); if (!a || muted) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), a.currentTime + dur);
  g.gain.setValueAtTime(vol, a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur);
}
function noise(dur, vol = 0.15) {
  const a = audio(); if (!a || muted) return;
  const len = a.sampleRate * dur, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const s = a.createBufferSource(), g = a.createGain();
  s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  shot: () => beep(880, 0.05, 'square', 0.02, -300),
  hit: () => beep(220, 0.06, 'sawtooth', 0.03, -100),
  boom: () => noise(0.35, 0.18),
  bigBoom: () => { noise(0.9, 0.3); beep(80, 0.8, 'sawtooth', 0.08, -60); },
  power: () => { beep(600, 0.08, 'triangle', 0.08); setTimeout(() => beep(900, 0.12, 'triangle', 0.08), 70); },
  hurt: () => { noise(0.3, 0.25); beep(160, 0.3, 'square', 0.06, -120); },
  bomb: () => { noise(1.2, 0.35); beep(60, 1.2, 'sine', 0.2, -40); },
};

// ---------- Input ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  audio();
  if (e.code === 'Enter' || e.code === 'Space') { if (state !== 'play') startGame(); }
  if (e.code === 'KeyP' || e.code === 'Escape') { if (state === 'play') paused = !paused; }
  if (e.code === 'KeyB' || e.code === 'KeyX') useBomb();
  if (e.code === 'KeyM') muted = !muted;
});
addEventListener('keyup', e => { keys[e.code] = false; });

// 터치/마우스 드래그: 손가락 따라 이동 (상대 이동)
let pointer = null;
function ptPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
let lastTap = 0;
cv.addEventListener('pointerdown', e => {
  audio();
  const p = ptPos(e);
  if (state !== 'play') { startGame(); return; }
  const now = performance.now();
  if (now - lastTap < 280) useBomb();
  lastTap = now;
  pointer = { id: e.pointerId, x: p.x, y: p.y, px: player.x, py: player.y };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!pointer || e.pointerId !== pointer.id) return;
  const p = ptPos(e);
  player.x = pointer.px + (p.x - pointer.x) * 1.3;
  player.y = pointer.py + (p.y - pointer.y) * 1.3;
});
const endPtr = e => { if (pointer && e.pointerId === pointer.id) pointer = null; };
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);

// ---------- Helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const hit = (a, b) => dist2(a, b) < (a.r + b.r) ** 2;
let best = 0;
try { best = +localStorage.getItem('skyStrikerBest') || 0; } catch (e) {}

// ---------- Starfield ----------
const stars = Array.from({ length: 110 }, () => ({ x: rand(0, W), y: rand(0, H), z: rand(0.2, 1) }));

// ---------- Game state ----------
let state = 'title', paused = false;
let player, bullets = [], eBullets = [], enemies = [], parts = [], items = [], floaters = [];
let score = 0, wave = 0, waveTimer = 0, spawnTimer = 0, boss = null, shake = 0, flash = 0, time = 0, bannerT = 0, bannerText = '';

function startGame() {
  player = { x: W / 2, y: H - 100, r: 10, hp: 3, power: 1, bombs: 2, cool: 0, inv: 120, shield: 0 };
  bullets = []; eBullets = []; enemies = []; parts = []; items = []; floaters = [];
  score = 0; wave = 0; boss = null; shake = 0; flash = 0; time = 0;
  paused = false; state = 'play';
  nextWave();
}

function nextWave() {
  wave++;
  waveTimer = 60 * 22;  // 웨이브당 약 22초
  spawnTimer = 60;
  bannerT = 150;
  bannerText = wave % 5 === 0 ? `WAVE ${wave} — 보스 출현!` : `WAVE ${wave}`;
  if (wave % 5 === 0) spawnBoss();
}

// ---------- Enemies ----------
const TYPES = {
  // 작은 전투기: 직선 하강
  scout: { r: 14, hp: 1, speed: 2.6, score: 100, color: '#ff5d73' },
  // 지그재그 비행
  weaver: { r: 16, hp: 3, speed: 1.8, score: 200, color: '#ffb84d' },
  // 멈춰서 조준 사격
  gunner: { r: 20, hp: 7, speed: 1.4, score: 400, color: '#b57bff' },
  // 큰 폭격기: 부채꼴 탄막
  heavy: { r: 30, hp: 18, speed: 0.8, score: 900, color: '#4dd2ff' },
};

function spawnEnemy() {
  const pool = ['scout', 'scout', 'weaver'];
  if (wave >= 2) pool.push('gunner', 'weaver');
  if (wave >= 3) pool.push('heavy');
  if (wave >= 6) pool.push('gunner', 'heavy');
  const t = pool[Math.floor(Math.random() * pool.length)];
  const T = TYPES[t];
  const hpScale = 1 + (wave - 1) * 0.15;
  const base = { type: t, x: rand(30, W - 30), y: -40, r: T.r, hp: Math.ceil(T.hp * hpScale), maxHp: Math.ceil(T.hp * hpScale),
    vy: T.speed * (1 + wave * 0.04), vx: 0, t: 0, fire: rand(40, 120), color: T.color, score: T.score, flashT: 0 };
  if (t === 'scout' && Math.random() < 0.5) {
    // 편대 비행
    const x0 = rand(60, W - 60);
    for (let i = 0; i < 4; i++) enemies.push({ ...base, x: x0 + (i - 1.5) * 34, y: -40 - i * 30 });
    return;
  }
  if (t === 'weaver') base.phase = rand(0, Math.PI * 2);
  if (t === 'gunner') base.stopY = rand(90, 260);
  enemies.push(base);
}

function spawnBoss() {
  const lv = wave / 5;
  boss = { type: 'boss', x: W / 2, y: -120, r: 56, hp: 260 * lv, maxHp: 260 * lv, t: 0, phase: 0,
    fire: 0, color: '#ff4466', score: 10000 * lv, flashT: 0, entering: true };
  enemies.push(boss);
}

function aimShot(e, speed, spread = 0, n = 1) {
  const a0 = Math.atan2(player.y - e.y, player.x - e.x);
  for (let i = 0; i < n; i++) {
    const a = a0 + (n > 1 ? (i - (n - 1) / 2) * spread : 0);
    eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5, c: '#ff7ab0' });
  }
}
function ringShot(e, n, speed, off = 0, c = '#ffd166') {
  for (let i = 0; i < n; i++) {
    const a = off + i / n * Math.PI * 2;
    eBullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, r: 5, c });
  }
}

function updateEnemy(e) {
  e.t++;
  if (e.flashT > 0) e.flashT--;
  const diff = Math.min(1 + wave * 0.08, 2.2);
  switch (e.type) {
    case 'scout': e.y += e.vy; break;
    case 'weaver':
      e.y += e.vy; e.x += Math.sin(e.t / 25 + e.phase) * 2.6;
      if (--e.fire <= 0) { aimShot(e, 3.2); e.fire = rand(90, 150) / diff; }
      break;
    case 'gunner':
      if (e.y < e.stopY) e.y += e.vy * 1.6;
      else if (e.t > 360) e.y += e.vy * 2;
      e.x += Math.sin(e.t / 60) * 0.8;
      if (e.y > 0 && --e.fire <= 0) { aimShot(e, 3.6, 0.22, 3); e.fire = rand(70, 110) / diff; }
      break;
    case 'heavy':
      e.y += e.vy;
      if (e.y > 0 && --e.fire <= 0) { aimShot(e, 2.6, 0.18, 5); e.fire = 120 / diff; }
      break;
    case 'boss': updateBoss(e); break;
  }
  e.x = clamp(e.x, e.r * 0.5, W - e.r * 0.5);
}

function updateBoss(b) {
  if (b.entering) { b.y += 1.2; if (b.y >= 130) b.entering = false; return; }
  b.x = W / 2 + Math.sin(b.t / 90) * 150;
  const hpRatio = b.hp / b.maxHp;
  const fast = hpRatio < 0.4 ? 0.65 : 1;
  b.fire--;
  if (b.fire <= 0) {
    b.phase = (b.phase + 1) % 4;
    switch (b.phase) {
      case 0: for (let k = 0; k < 3; k++) setTimeout(() => state === 'play' && boss === b && ringShot(b, 18, 2.6, k * 0.17), k * 180); break;
      case 1: aimShot(b, 4.2, 0.12, 7); break;
      case 2: for (let k = 0; k < 12; k++) setTimeout(() => state === 'play' && boss === b && ringShot(b, 4, 3, b.t / 10 + k * 0.3, '#7cf7ff'), k * 70); break;
      case 3: for (let k = 0; k < 5; k++) setTimeout(() => state === 'play' && boss === b && aimShot(b, 5, 0, 1), k * 120); break;
    }
    b.fire = 100 * fast;
  }
}

// ---------- Player ----------
function firePlayer() {
  const p = player, lv = p.power;
  const shoot = (dx, ang, dmg = 1) => bullets.push({ x: p.x + dx, y: p.y - 18, vx: Math.sin(ang) * 11, vy: -Math.cos(ang) * 11, r: 4, dmg });
  shoot(0, 0, 1.2);
  if (lv >= 2) { shoot(-10, 0); shoot(10, 0); }
  if (lv >= 3) { shoot(-14, -0.15); shoot(14, 0.15); }
  if (lv >= 4) { shoot(-18, -0.3); shoot(18, 0.3); }
  if (lv >= 5) { shoot(-6, -0.05, 1.2); shoot(6, 0.05, 1.2); }
  sfx.shot();
}

function useBomb() {
  if (state !== 'play' || paused || player.bombs <= 0) return;
  player.bombs--;
  sfx.bomb(); flash = 30; shake = 25;
  eBullets.length = 0;
  for (const e of enemies) damage(e, e.type === 'boss' ? 40 : 999);
  player.inv = Math.max(player.inv, 60);
}

function hurtPlayer() {
  if (player.inv > 0) return;
  if (player.shield > 0) { player.shield = 0; player.inv = 60; sfx.hit(); burst(player.x, player.y, '#6cf', 20); return; }
  player.hp--;
  player.power = Math.max(1, player.power - 1);
  player.inv = 150; shake = 18; sfx.hurt();
  burst(player.x, player.y, '#fff', 40);
  eBullets.length = 0;
  if (player.hp <= 0) gameOver();
}

function gameOver() {
  state = 'over';
  sfx.bigBoom();
  burst(player.x, player.y, '#ffb84d', 80);
  if (score > best) { best = score; try { localStorage.setItem('skyStrikerBest', best); } catch (e) {} }
}

// ---------- Damage / effects ----------
function damage(e, d) {
  if (e.dead) return;
  e.hp -= d; e.flashT = 4;
  if (e.hp <= 0) {
    e.dead = true;
    score += e.score;
    floaters.push({ x: e.x, y: e.y, t: 50, text: '+' + e.score });
    if (e.type === 'boss') {
      sfx.bigBoom(); shake = 40; flash = 20;
      for (let i = 0; i < 6; i++) setTimeout(() => burst(e.x + rand(-50, 50), e.y + rand(-40, 40), '#ff7744', 40), i * 120);
      eBullets.length = 0;
      boss = null;
      dropItem(e.x - 30, e.y, 'P'); dropItem(e.x + 30, e.y, 'H'); dropItem(e.x, e.y, 'B');
      waveTimer = 120;
    } else {
      sfx.boom(); shake = Math.max(shake, e.r / 4);
      burst(e.x, e.y, e.color, e.r * 1.5);
      const chance = { scout: 0.05, weaver: 0.12, gunner: 0.25, heavy: 0.6 }[e.type];
      if (Math.random() < chance) {
        const r = Math.random();
        dropItem(e.x, e.y, r < 0.55 ? 'P' : r < 0.75 ? 'S' : r < 0.9 ? 'B' : 'H');
      }
    }
  }
}

function dropItem(x, y, kind) { items.push({ x, y, r: 12, kind, vy: 1.3, t: 0 }); }

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.5, 5);
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(20, 50), max: 50, c: Math.random() < 0.3 ? '#fff' : color, size: rand(1.5, 3.5) });
  }
}

function collect(it) {
  sfx.power();
  const p = player;
  const labels = { P: '파워 업!', S: '실드!', B: '폭탄 +1', H: '체력 +1' };
  if (it.kind === 'P') { if (p.power < 5) p.power++; else score += 1000; }
  if (it.kind === 'S') p.shield = 1;
  if (it.kind === 'B') p.bombs = Math.min(5, p.bombs + 1);
  if (it.kind === 'H') p.hp = Math.min(5, p.hp + 1);
  floaters.push({ x: it.x, y: it.y, t: 60, text: labels[it.kind], c: '#7fffb0' });
}

// ---------- Update ----------
function update() {
  time++;
  for (const s of stars) { s.y += s.z * (state === 'play' ? 3 : 1.2); if (s.y > H) { s.y = 0; s.x = rand(0, W); } }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life--; }
  parts = parts.filter(p => p.life > 0);
  if (shake > 0) shake *= 0.88;
  if (flash > 0) flash--;
  if (state !== 'play' || paused) return;

  // 이동
  const p = player, sp = (keys.ShiftLeft || keys.ShiftRight) ? 2.6 : 5;
  let dx = 0, dy = 0;
  if (keys.ArrowLeft || keys.KeyA) dx--;
  if (keys.ArrowRight || keys.KeyD) dx++;
  if (keys.ArrowUp || keys.KeyW) dy--;
  if (keys.ArrowDown || keys.KeyS) dy++;
  if (dx && dy) { dx *= 0.707; dy *= 0.707; }
  p.x = clamp(p.x + dx * sp, 16, W - 16);
  p.y = clamp(p.y + dy * sp, 40, H - 24);
  p.tilt = dx;

  // 자동 사격
  if (--p.cool <= 0) { firePlayer(); p.cool = 7; }
  if (p.inv > 0) p.inv--;

  // 웨이브 진행
  if (!boss) {
    waveTimer--;
    if (waveTimer > 120 && --spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(18, 70 - wave * 5) + rand(0, 30);
    }
    if (waveTimer <= 0 && enemies.length === 0) nextWave();
    else if (waveTimer <= -600) nextWave(); // 안전장치
  }
  if (bannerT > 0) bannerT--;

  // 총알
  for (const b of bullets) { b.x += b.vx; b.y += b.vy; }
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);
  for (const b of eBullets) { b.x += b.vx; b.y += b.vy; }
  eBullets = eBullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  // 적
  for (const e of enemies) updateEnemy(e);
  for (const b of bullets) {
    for (const e of enemies) {
      if (!e.dead && !b.dead && hit(b, e) && !(e.type === 'boss' && e.entering)) {
        b.dead = true; damage(e, b.dmg);
        if (!e.dead) { sfx.hit(); parts.push({ x: b.x, y: b.y, vx: rand(-1, 1), vy: rand(-1, 0), life: 10, max: 10, c: '#fff', size: 2 }); }
      }
    }
  }
  enemies = enemies.filter(e => !e.dead && e.y < H + 60);

  // 피격 판정 (플레이어 판정은 작게)
  const core = { x: p.x, y: p.y, r: 4 };
  for (const b of eBullets) if (hit(core, b)) { b.y = H + 99; hurtPlayer(); }
  for (const e of enemies) if (hit({ x: p.x, y: p.y, r: 9 }, e)) { if (e.type !== 'boss') damage(e, 999); hurtPlayer(); }

  // 아이템
  for (const it of items) {
    it.t++; it.y += it.vy; it.x += Math.sin(it.t / 20) * 0.6;
    if (dist2(it, p) < 90 ** 2) { it.x += (p.x - it.x) * 0.06; it.y += (p.y - it.y) * 0.06; }
    if (hit(it, { x: p.x, y: p.y, r: 16 })) { it.got = true; collect(it); }
  }
  items = items.filter(it => !it.got && it.y < H + 20);
  for (const f of floaters) { f.y -= 0.8; f.t--; }
  floaters = floaters.filter(f => f.t > 0);
}

// ---------- Draw ----------
function drawShip(x, y, tilt, alpha) {
  ctx.save(); ctx.translate(x, y); ctx.globalAlpha = alpha;
  ctx.scale(1 - Math.abs(tilt || 0) * 0.15, 1);
  // 엔진 불꽃
  const fl = 10 + Math.random() * 8;
  const g = ctx.createLinearGradient(0, 12, 0, 12 + fl);
  g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#5cf'); g.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(-5, 12); ctx.lineTo(0, 12 + fl); ctx.lineTo(5, 12); ctx.fill();
  // 날개
  ctx.fillStyle = '#3a6fd8';
  ctx.beginPath(); ctx.moveTo(0, -4); ctx.lineTo(-22, 10); ctx.lineTo(-20, 15); ctx.lineTo(0, 8); ctx.lineTo(20, 15); ctx.lineTo(22, 10); ctx.closePath(); ctx.fill();
  // 동체
  ctx.fillStyle = '#e8f0ff';
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(7, 4); ctx.lineTo(5, 14); ctx.lineTo(-5, 14); ctx.lineTo(-7, 4); ctx.closePath(); ctx.fill();
  // 조종석
  ctx.fillStyle = '#4fe3ff';
  ctx.beginPath(); ctx.ellipse(0, -6, 3, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  const c = e.flashT > 0 ? '#fff' : e.color;
  ctx.fillStyle = c; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 2;
  const r = e.r;
  ctx.beginPath();
  switch (e.type) {
    case 'scout':
      ctx.moveTo(0, r); ctx.lineTo(-r, -r * 0.6); ctx.lineTo(0, -r * 0.2); ctx.lineTo(r, -r * 0.6); break;
    case 'weaver':
      ctx.moveTo(0, r); ctx.lineTo(-r, 0); ctx.lineTo(-r * 0.4, -r); ctx.lineTo(r * 0.4, -r); ctx.lineTo(r, 0); break;
    case 'gunner':
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + e.t / 40; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } break;
    case 'heavy':
      ctx.moveTo(0, r); ctx.lineTo(-r, r * 0.2); ctx.lineTo(-r * 1.1, -r * 0.5); ctx.lineTo(-r * 0.3, -r * 0.8);
      ctx.lineTo(r * 0.3, -r * 0.8); ctx.lineTo(r * 1.1, -r * 0.5); ctx.lineTo(r, r * 0.2); break;
    case 'boss':
      ctx.moveTo(0, r); ctx.lineTo(-r * 0.5, r * 0.6); ctx.lineTo(-r * 1.6, r * 0.2); ctx.lineTo(-r * 1.4, -r * 0.5);
      ctx.lineTo(-r * 0.5, -r * 0.4); ctx.lineTo(-r * 0.3, -r); ctx.lineTo(r * 0.3, -r); ctx.lineTo(r * 0.5, -r * 0.4);
      ctx.lineTo(r * 1.4, -r * 0.5); ctx.lineTo(r * 1.6, r * 0.2); ctx.lineTo(r * 0.5, r * 0.6); break;
  }
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // 코어
  ctx.fillStyle = e.flashT > 0 ? '#fff' : 'rgba(20,10,40,.7)';
  ctx.beginPath(); ctx.arc(0, 0, r * (e.type === 'boss' ? 0.3 : 0.28), 0, Math.PI * 2); ctx.fill();
  if (e.type === 'boss') {
    ctx.fillStyle = `hsl(${(time * 6) % 360},100%,65%)`;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  // 체력바 (큰 적)
  if (e.type === 'heavy' || e.type === 'gunner') {
    if (e.hp < e.maxHp) {
      ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2, 3);
      ctx.fillStyle = '#7fffb0'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2 * e.hp / e.maxHp, 3);
    }
  }
}

const ITEM_COLOR = { P: '#ff5df0', S: '#5cf', B: '#ffb84d', H: '#7fffb0' };
function drawItem(it) {
  ctx.save(); ctx.translate(it.x, it.y);
  ctx.rotate(Math.sin(it.t / 15) * 0.3);
  ctx.shadowColor = ITEM_COLOR[it.kind]; ctx.shadowBlur = 14;
  ctx.fillStyle = ITEM_COLOR[it.kind];
  ctx.beginPath(); ctx.roundRect(-11, -11, 22, 22, 6); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#10142a'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(it.kind, 0, 1);
  ctx.restore();
}

function text(s, x, y, size, color = '#fff', align = 'center', weight = 'bold') {
  ctx.font = `${weight} ${size}px -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(s, x, y);
}

function drawHUD() {
  text(`SCORE ${score.toLocaleString()}`, 14, 22, 18, '#fff', 'left');
  text(`BEST ${Math.max(best, score).toLocaleString()}`, 14, 44, 12, '#8a9bd0', 'left', 'normal');
  text(`WAVE ${wave}`, W - 14, 22, 16, '#ffd166', 'right');
  // 체력
  for (let i = 0; i < player.hp; i++) {
    ctx.fillStyle = '#ff5d73';
    const x = 18 + i * 22, y = H - 22;
    ctx.beginPath(); ctx.moveTo(x, y + 6); ctx.bezierCurveTo(x - 10, y - 2, x - 6, y - 10, x, y - 4);
    ctx.bezierCurveTo(x + 6, y - 10, x + 10, y - 2, x, y + 6); ctx.fill();
  }
  // 폭탄
  for (let i = 0; i < player.bombs; i++) {
    ctx.fillStyle = '#ffb84d'; ctx.beginPath(); ctx.arc(W - 20 - i * 20, H - 22, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#10142a'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('B', W - 20 - i * 20, H - 21);
  }
  text(`POWER ${'■'.repeat(player.power)}${'□'.repeat(5 - player.power)}`, W / 2, H - 22, 12, '#ff5df0');
  // 보스 체력
  if (boss && !boss.dead) {
    ctx.fillStyle = 'rgba(255,255,255,.15)'; ctx.fillRect(60, 60, W - 120, 8);
    ctx.fillStyle = '#ff4466'; ctx.fillRect(60, 60, (W - 120) * Math.max(0, boss.hp) / boss.maxHp, 8);
    text('BOSS', W / 2, 78, 11, '#ff8899');
  }
}

function draw() {
  ctx.save();
  ctx.fillStyle = '#070a1c'; ctx.fillRect(0, 0, W, H);
  if (shake > 0.5) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

  for (const s of stars) {
    ctx.fillStyle = `rgba(180,200,255,${s.z * 0.8})`;
    ctx.fillRect(s.x, s.y, s.z * 2, s.z * (state === 'play' ? 6 : 2));
  }

  if (state === 'play' || state === 'over') {
    for (const it of items) drawItem(it);
    for (const e of enemies) drawEnemy(e);
    // 플레이어 총알
    ctx.fillStyle = '#9ff';
    ctx.shadowColor = '#5cf'; ctx.shadowBlur = 8;
    for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
    ctx.shadowBlur = 0;
    // 적 총알
    for (const b of eBullets) {
      ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.45, 0, Math.PI * 2); ctx.fill();
    }
    if (state === 'play') {
      const blink = player.inv > 0 && Math.floor(player.inv / 5) % 2 === 0;
      drawShip(player.x, player.y, player.tilt, blink ? 0.35 : 1);
      if (player.shield) {
        ctx.strokeStyle = `rgba(100,220,255,${0.5 + Math.sin(time / 6) * 0.3})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(player.x, player.y, 26, 0, Math.PI * 2); ctx.stroke();
      }
      // 피격 판정 점 (저속 이동 시 표시)
      if (keys.ShiftLeft || keys.ShiftRight) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(player.x, player.y, 4, 0, Math.PI * 2); ctx.fill(); }
    }
  }

  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.t / 20); text(f.text, f.x, f.y, 13, f.c || '#ffd166'); }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash / 40})`; ctx.fillRect(0, 0, W, H); }

  if (state === 'play') {
    drawHUD();
    if (bannerT > 0) {
      ctx.globalAlpha = Math.min(1, bannerT / 30);
      text(bannerText, W / 2, H / 2 - 60, 30, wave % 5 === 0 ? '#ff5d73' : '#ffd166');
      ctx.globalAlpha = 1;
    }
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
      text('일시정지', W / 2, H / 2 - 10, 34);
      text('P 또는 ESC로 계속', W / 2, H / 2 + 30, 14, '#aab', 'center', 'normal');
    }
  } else if (state === 'title') {
    text('SKY STRIKER', W / 2, 200, 46, '#ffd166');
    text('스카이 스트라이커', W / 2, 245, 18, '#8ac7ff', 'center', 'normal');
    drawShip(W / 2, 340 + Math.sin(time / 20) * 6, 0, 1);
    const lines = [
      '이동: 방향키 / WASD  (Shift: 정밀 이동)',
      '사격: 자동    폭탄: B 또는 X',
      '일시정지: P    소리: M',
      '모바일: 드래그 이동 · 더블탭 폭탄',
    ];
    lines.forEach((l, i) => text(l, W / 2, 430 + i * 26, 14, '#c7d0f0', 'center', 'normal'));
    text('아이템  P 파워 · S 실드 · B 폭탄 · H 체력', W / 2, 545, 13, '#7fffb0', 'center', 'normal');
    if (Math.floor(time / 30) % 2 === 0) text('ENTER / 탭으로 시작', W / 2, 610, 20);
    if (best) text(`최고 점수 ${best.toLocaleString()}`, W / 2, 650, 13, '#8a9bd0', 'center', 'normal');
  } else if (state === 'over') {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    text('GAME OVER', W / 2, H / 2 - 70, 44, '#ff5d73');
    text(`점수 ${score.toLocaleString()}`, W / 2, H / 2 - 10, 24);
    text(`WAVE ${wave} 도달`, W / 2, H / 2 + 22, 15, '#ffd166', 'center', 'normal');
    text(score >= best && score > 0 ? '🎉 신기록!' : `최고 점수 ${best.toLocaleString()}`, W / 2, H / 2 + 52, 15, '#8ac7ff', 'center', 'normal');
    if (Math.floor(time / 30) % 2 === 0) text('ENTER / 탭으로 재시작', W / 2, H / 2 + 110, 18);
  }
}

// ---------- Loop (고정 60fps 스텝) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
addEventListener('blur', () => { if (state === 'play') paused = true; });
})();
</script>
</body>
</html>
